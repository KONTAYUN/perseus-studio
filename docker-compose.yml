services:
  webide:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io}
        APP_VERSION: ${APP_VERSION:-dev}
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_BUILT_AT: ${APP_BUILT_AT:-unknown}
    environment:
      BACKEND_ADDR: ":8080"
      BACKEND_DB_PATH: "/data/app.db"
      SQLITE_JOURNAL_MODE: "${SQLITE_JOURNAL_MODE:-DELETE}"
      SQLITE_SYNCHRONOUS: "${SQLITE_SYNCHRONOUS:-FULL}"
      FRONTEND_DIST: "/app/dist"
      USER_DATA_ROOT: "/data/users"
      ENABLE_DEBUG_API: "${ENABLE_DEBUG_API:-false}"
      TASK_WORKER_COUNT: "${TASK_WORKER_COUNT:-2}"
      AGENT_CONCURRENCY: "${AGENT_CONCURRENCY:-2}"
      AGENT_QUEUE_CAPACITY: "${AGENT_QUEUE_CAPACITY:-64}"
      PERSEUS_COMMAND_EXECUTION: "${PERSEUS_COMMAND_EXECUTION:-}"
      PERSEUS_RUN_MAX_PROVIDER_REQUESTS: "${PERSEUS_RUN_MAX_PROVIDER_REQUESTS:-192}"
      TASK_POLL_INTERVAL: "${TASK_POLL_INTERVAL:-1500ms}"
      BACKEND_SHUTDOWN_TIMEOUT: "${BACKEND_SHUTDOWN_TIMEOUT:-10s}"
      PERSEUS_ADMIN_USERNAME: "${PERSEUS_ADMIN_USERNAME:-}"
      PERSEUS_ADMIN_PASSWORD: "${PERSEUS_ADMIN_PASSWORD:-}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
