services:
  webide:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io}
        APP_VERSION: ${APP_VERSION:-dev}
        APP_COMMIT: ${APP_COMMIT:-unknown}
        APP_BUILT_AT: ${APP_BUILT_AT:-unknown}
    environment:
      BACKEND_ADDR: ":8080"
      BACKEND_DB_PATH: "/data/app.db"
      SQLITE_JOURNAL_MODE: "${SQLITE_JOURNAL_MODE:-DELETE}"
      SQLITE_SYNCHRONOUS: "${SQLITE_SYNCHRONOUS:-FULL}"
      FRONTEND_DIST: "/app/dist"
      USER_DATA_ROOT: "/data/users"
      ENABLE_DEBUG_API: "${ENABLE_DEBUG_API:-false}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-auto}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      HTTP_READ_HEADER_TIMEOUT: "${HTTP_READ_HEADER_TIMEOUT:-10s}"
      HTTP_IDLE_TIMEOUT: "${HTTP_IDLE_TIMEOUT:-120s}"
      HTTP_REQUEST_TIMEOUT: "${HTTP_REQUEST_TIMEOUT:-30s}"
      AUTH_LOGIN_RATE_PER_MINUTE: "${AUTH_LOGIN_RATE_PER_MINUTE:-5}"
      AUTH_LOGIN_RATE_BURST: "${AUTH_LOGIN_RATE_BURST:-10}"
      AUTH_REGISTER_RATE_PER_HOUR: "${AUTH_REGISTER_RATE_PER_HOUR:-3}"
      UPLOAD_RATE_PER_MINUTE: "${UPLOAD_RATE_PER_MINUTE:-30}"
      AGENT_MAX_CONCURRENT_GLOBAL: "${AGENT_MAX_CONCURRENT_GLOBAL:-4}"
      AGENT_MAX_CONCURRENT_PER_USER: "${AGENT_MAX_CONCURRENT_PER_USER:-2}"
      AGENT_MAX_QUEUED_GLOBAL: "${AGENT_MAX_QUEUED_GLOBAL:-100}"
      AGENT_MAX_QUEUED_PER_USER: "${AGENT_MAX_QUEUED_PER_USER:-10}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    stop_grace_period: 20s
    pids_limit: ${PIDS_LIMIT:-256}
    cpus: ${CPU_LIMIT:-2.0}
    mem_limit: ${MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
