name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ui
      - run: npm run test:structure
      - run: npm run test:unit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum
      - run: go test ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go test -race ./internal/runqueue ./internal/store ./internal/tasks
        working-directory: backend

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: go build -o /tmp/perseus-e2e ./cmd/server
        working-directory: backend
      - name: Run browser and agent editing regressions
        env:
          BACKEND_ADDR: '127.0.0.1:8080'
          BACKEND_DB_PATH: /tmp/perseus-e2e-data/app.db
          USER_DATA_ROOT: /tmp/perseus-e2e-data/users
          FRONTEND_DIST: ${{ github.workspace }}/dist
          PERSEUS_ADMIN_USERNAME: e2e
          PERSEUS_ADMIN_PASSWORD: local-e2e-password
          PERSEUS_E2E_USERNAME: e2e
          PERSEUS_E2E_PASSWORD: local-e2e-password
        run: |
          /tmp/perseus-e2e > /tmp/perseus-e2e.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then break; fi
            sleep 1
          done
          npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: |
            test-results/
            /tmp/perseus-e2e.log
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image metadata
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ steps.image.outputs.built_at }}
