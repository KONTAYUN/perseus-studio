name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:ui
      - run: npm run test:structure
      - run: npm run test:unit
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
        working-directory: backend

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start production image and deterministic provider
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile e2e up -d --build --wait
      - name: Run browser end-to-end tests
        run: npm run test:e2e
        env:
          PERSEUS_E2E_USERNAME: admin
          PERSEUS_E2E_PASSWORD: password
      - name: Capture service logs
        if: always()
        run: |
          mkdir -p e2e-artifacts
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile e2e logs --no-color > e2e-artifacts/containers.log
      - name: Upload end-to-end artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perseus-e2e-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            e2e-artifacts/
      - name: Stop end-to-end stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile e2e down -v

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image metadata
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ steps.image.outputs.built_at }}
